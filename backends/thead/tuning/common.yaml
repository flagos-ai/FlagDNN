    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}
  - META: {BLOCK_M: 32, BLOCK_N: 32}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}
sdpa_backward_dq:
