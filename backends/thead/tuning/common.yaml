# Conservative wave32 search space for the platform-neutral pointwise kernels.
# Every compiler switch is explicit so it participates in candidate identity.
binary:
  - META: {BLOCK_SIZE: 128}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}
  - META: {BLOCK_SIZE: 256}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}

relu:
  - META: {BLOCK_SIZE: 128}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}
  - META: {BLOCK_SIZE: 256}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}

# Conservative wave32 search space for the common reduction kernels.
reduction:
  - META: {BLOCK_M: 8, BLOCK_N: 32}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}
  - META: {BLOCK_M: 16, BLOCK_N: 64}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}

# NCHW BatchNorm and BatchNorm-inference launch shapes.
batch_norm:
  - META: {BLOCK_SIZE: 256}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}
  - META: {BLOCK_SIZE: 512}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}

# Normalized suffixes qualified on PPU.  Both candidates cover every selected
# LayerNorm/RMSNorm slice while varying the reduction tile size.
layer_norm:
  - META: {BLOCK_SIZE: 128, ROWS_PER_PROGRAM: 1}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}
  - META: {BLOCK_SIZE: 256, ROWS_PER_PROGRAM: 1}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}

rms_norm:
  - META: {BLOCK_SIZE: 128, ROWS_PER_PROGRAM: 1}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}
  - META: {BLOCK_SIZE: 256, ROWS_PER_PROGRAM: 1}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}

# Conservative IEEE-FP32 MatMul tiles for the PPU CUDA-compatible backend.
matmul:
  - META: {BLOCK_M: 64, BLOCK_N: 64, BLOCK_K: 32, GROUP_M: 8}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}
  - META: {BLOCK_M: 128, BLOCK_N: 128, BLOCK_K: 32, GROUP_M: 8}
    num_warps: 8
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}

# Shared conservative candidates.  The compiler maps the complete metadata
# record onto the exact FProp, DGrad, or WGrad entry-point signature.
conv2d_spatial:
  - META: {BLOCK_M: 16, BLOCK_OC: 16, BLOCK_CI: 16, BLOCK_K: 16, BLOCK_HW: 16}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}
  - META: {BLOCK_M: 32, BLOCK_OC: 32, BLOCK_CI: 32, BLOCK_K: 32, BLOCK_HW: 32}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}

# Complete small attention profiles qualified with the PPU compiler.
sdpa:
