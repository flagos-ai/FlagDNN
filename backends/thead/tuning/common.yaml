    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}
  - META: {}
    num_warps: 8
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}

sdpa_fp8:
  - META: {}
    num_warps: 4
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}
  - META: {}
    num_warps: 8
    num_stages: 1
    maxnreg: null
    ppu_compiler_options: {}

sdpa_fp8_backward:
