# corex_71/warp64 strict-IEEE convolution search spaces. Each direction uses
# a union META schema; compiler_nn projects it to constants accepted by the
# selected registered CoreX stage. Entries remain explicit for deterministic,
# auditable autotuning.
conv_fprop:
  - META:
      BLOCK_M: 16
      BLOCK_HW: 16
      BLOCK_OC: 16
      BLOCK_CI: 16
      BLOCK_K: 16
      GROUP_M: 4
    num_warps: 2
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_HW: 32
      BLOCK_OC: 32
      BLOCK_CI: 16
      BLOCK_K: 16
      GROUP_M: 4
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_HW: 64
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_HW: 64
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_HW: 64
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_HW: 128
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_HW: 128
      BLOCK_OC: 128
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_HW: 128
      BLOCK_OC: 128
      BLOCK_CI: 64
      BLOCK_K: 64
      GROUP_M: 8
    num_warps: 8
    num_stages: 1
  - META:
      BLOCK_M: 256
      BLOCK_HW: 256
      BLOCK_OC: 64
      BLOCK_CI: 64
      BLOCK_K: 64
      GROUP_M: 8
    num_warps: 8
    num_stages: 1
  - META:
      BLOCK_M: 256
      BLOCK_HW: 256
      BLOCK_OC: 128
      BLOCK_CI: 64
      BLOCK_K: 64
      GROUP_M: 8
    num_warps: 8
    num_stages: 1
  - META:
      BLOCK_M: 128
      BLOCK_HW: 128
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 4
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_HW: 128
      BLOCK_OC: 128
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 4
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_HW: 64
      BLOCK_OC: 64
      BLOCK_CI: 64
      BLOCK_K: 64
      GROUP_M: 4
    num_warps: 2
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_HW: 64
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 2
    num_warps: 2
    num_stages: 2
  # Row-bounded low-channel stem tile.  BLOCK_M stays within one output row,
  # removing per-element row/column division in the registered CoreX path.
  - META:
      BLOCK_M: 32
      BLOCK_HW: 32
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 1
    num_warps: 4
    num_stages: 1
  # Large-reduction FProp GEMM shapes (for example YOLO P5) benefit from a
  # wider reduction tile on corex_71.  Keep both aspect ratios because output
  # channel count and output area vary independently across the shared NVIDIA
  # benchmark catalog; each registered stage projects only the META it consumes.
  - META:
      BLOCK_M: 32
      BLOCK_HW: 32
      BLOCK_OC: 128
      BLOCK_CI: 64
      BLOCK_K: 64
      GROUP_M: 2
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_HW: 128
      BLOCK_OC: 32
      BLOCK_CI: 64
      BLOCK_K: 64
      GROUP_M: 1
    num_warps: 4
    num_stages: 2

  # Exact-output-channel tile for the 16-channel YOLO-N stem.
  - META:
      BLOCK_M: 32
      BLOCK_HW: 32
      BLOCK_OC: 16
      BLOCK_CI: 16
      BLOCK_K: 16
      GROUP_M: 4
    num_warps: 2
    num_stages: 1

  # Row-bounded, single-stage tile for the 32-channel YOLO-S stem.
  - META:
      BLOCK_M: 64
      BLOCK_HW: 64
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 8
    num_stages: 1

  # Wide short-K tile for the 96-channel YOLO-X stem.
  - META:
      BLOCK_M: 256
      BLOCK_HW: 256
      BLOCK_OC: 128
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 8
    num_stages: 1

  # Exact-output-channel pipeline for the three-step FP32 1D reduction.
  - META:
      BLOCK_M: 256
      BLOCK_HW: 256
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 16
    num_stages: 3

  # Pipeline-depth neighbor for the exact 64-channel stem tile.
  - META:
      BLOCK_M: 256
      BLOCK_HW: 256
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 16
    num_stages: 4

  # CoreX warp64 high-occupancy tile for contiguous NCHW 1x1 convolution.
  - META:
      BLOCK_M: 128
      BLOCK_HW: 128
      BLOCK_OC: 128
      BLOCK_CI: 64
      BLOCK_K: 64
      GROUP_M: 8
    num_warps: 16
    num_stages: 1

conv_dgrad:
  - META:
      BLOCK_M: 16
      BLOCK_CI: 16
      BLOCK_CO: 16
      BLOCK_K: 16
      GROUP_M: 4
      BLOCK_SIZE: 128
    num_warps: 2
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_CI: 16
      BLOCK_CO: 32
      BLOCK_K: 16
      GROUP_M: 4
      BLOCK_SIZE: 256
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_CI: 32
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_CI: 32
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 32
      BLOCK_CI: 32
      BLOCK_CO: 64
      BLOCK_K: 64
      GROUP_M: 8
      BLOCK_SIZE: 256
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 32
      BLOCK_CI: 64
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 256
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 32
      BLOCK_CI: 64
      BLOCK_CO: 64
      BLOCK_K: 64
      GROUP_M: 8
      BLOCK_SIZE: 512
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_CI: 64
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 512
    num_warps: 8
    num_stages: 2
  # corex_71 stride-2 DGrad winners.  The two 64x64 output tiles cover the
  # standard FP16 and large P5 FP32 aspect ratios; the narrower M tile with a
  # wider packed-CI tile removes excess work for the 512-channel P5 case.
  - META:
      BLOCK_M: 64
      BLOCK_CI: 64
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 4
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 64
      BLOCK_CI: 64
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 4
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 32
      BLOCK_CI: 128
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 64
      BLOCK_CI: 64
      BLOCK_CO: 64
      BLOCK_K: 64
      GROUP_M: 8
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_CI: 32
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_CI: 32
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 1024
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 256
      BLOCK_CI: 32
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 1
  - META:
      BLOCK_M: 512
      BLOCK_CI: 32
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 1
  - META:
      BLOCK_M: 256
      BLOCK_CI: 64
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 4
      BLOCK_SIZE: 256
    num_warps: 4
    num_stages: 2
conv_wgrad:
  - META:
      BLOCK_M: 32
      BLOCK_OC: 16
      BLOCK_CI: 16
      BLOCK_CI_K: 16
      BLOCK_K: 16
      BLOCK_SIZE: 128
    num_warps: 2
    num_stages: 1
  - META:
      BLOCK_M: 64
      BLOCK_OC: 16
      BLOCK_CI: 16
      BLOCK_CI_K: 32
      BLOCK_K: 16
      BLOCK_SIZE: 256
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 64
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_CI_K: 16
      BLOCK_K: 32
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_CI_K: 32
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  # Wide output/filter tiles are critical for the 40x40 P5 WGrad GEMMs on
  # corex_71. compiler_nn projects the union META to the constants consumed by the
  # current registered WGrad stage.
  - META:
      BLOCK_M: 64
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_OC: 128
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2

  # Row-major P5 WGrad winners from corex_71 probes.
  - META:
      BLOCK_M: 32
      BLOCK_OC: 128
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 32
      BLOCK_OC: 128
      BLOCK_CI: 32
      BLOCK_CI_K: 128
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_OC: 128
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 16
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 512
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 32
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 16
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_CI_K: 128
      BLOCK_K: 64
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_CI_K: 128
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 1
  # Additional row-major candidates; unused union keys are projected away.
  - META:
      BLOCK_M: 16
      BLOCK_OC: 16
      BLOCK_CI: 16
      BLOCK_CI_K: 32
      BLOCK_K: 32
      BLOCK_SIZE: 256
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 16
      BLOCK_OC: 16
      BLOCK_CI: 16
      BLOCK_CI_K: 32
      BLOCK_K: 64
      BLOCK_SIZE: 256
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 64
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_CI_K: 128
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  # Low-CI stem: match CIK=27 without the 2x padding of a 64-wide tile.
  - META:
      BLOCK_M: 64
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_CI_K: 32
      BLOCK_K: 32
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_CI_K: 32
      BLOCK_K: 32
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 1
  # Medium-aspect P5 tile and a square direct-stride tile found by the
  # corex_71 occupancy probes. Keep stage count low on the large P5 path.
  - META:
      BLOCK_M: 64
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_CI_K: 128
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 64
      BLOCK_OC: 128
      BLOCK_CI: 32
      BLOCK_CI_K: 128
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
