# Wave64-safe pointwise configurations. These kernels have no pipelined loop,
# so num_stages=2/3 duplicated launch shapes without adding a useful search
# dimension. Include larger vectorized tiles for bandwidth-bound dense tensors
# and one/two-wave launches for small or more expensive pointwise operations.
binary: &pointwise
  - META: {BLOCK_SIZE: 128}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 256}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 512}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 1024}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 1024}
    num_warps: 8
    num_stages: 1
  - META: {BLOCK_SIZE: 2048}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 4096}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 256}
    num_warps: 1
    num_stages: 1
  - META: {BLOCK_SIZE: 512}
    num_warps: 2
    num_stages: 1
  - META: {BLOCK_SIZE: 1024}
    num_warps: 2
    num_stages: 1

# The common unary registry names its pointwise table "relu"; all unary modes
# use the same launch-shape dimensions and are keyed by n_elements.
relu: *pointwise

# Identity is bandwidth-bound on gfx936.  TILES_PER_PROGRAM increases memory
# instruction-level parallelism without changing the graph ABI.  The space
# retains the best single-tile launch shapes from the baseline and adds
# explicitly bounded multi-tile variants; every candidate is wave64-safe.
identity:
  - META: {BLOCK_SIZE: 64, TILES_PER_PROGRAM: 1}
    num_warps: 1
    num_stages: 1
  - META: {BLOCK_SIZE: 64, TILES_PER_PROGRAM: 2}
    num_warps: 1
    num_stages: 1
  - META: {BLOCK_SIZE: 64, TILES_PER_PROGRAM: 4}
    num_warps: 1
    num_stages: 1
  - META: {BLOCK_SIZE: 64, TILES_PER_PROGRAM: 8}
    num_warps: 1
    num_stages: 1
  - META: {BLOCK_SIZE: 128, TILES_PER_PROGRAM: 1}
    num_warps: 2
    num_stages: 1
  - META: {BLOCK_SIZE: 128, TILES_PER_PROGRAM: 2}
    num_warps: 2
    num_stages: 1
  - META: {BLOCK_SIZE: 128, TILES_PER_PROGRAM: 4}
    num_warps: 2
    num_stages: 1
  - META: {BLOCK_SIZE: 128, TILES_PER_PROGRAM: 8}
    num_warps: 2
    num_stages: 1
  - META: {BLOCK_SIZE: 256, TILES_PER_PROGRAM: 1}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 256, TILES_PER_PROGRAM: 2}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 256, TILES_PER_PROGRAM: 4}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 256, TILES_PER_PROGRAM: 8}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 512, TILES_PER_PROGRAM: 1}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 512, TILES_PER_PROGRAM: 2}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 512, TILES_PER_PROGRAM: 4}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 512, TILES_PER_PROGRAM: 1}
    num_warps: 8
    num_stages: 1
  - META: {BLOCK_SIZE: 512, TILES_PER_PROGRAM: 2}
    num_warps: 8
    num_stages: 1
  - META: {BLOCK_SIZE: 1024, TILES_PER_PROGRAM: 1}
    num_warps: 8
    num_stages: 1

# Conservative wave64 reduction space. BLOCK_N is the reduction tile and
# BLOCK_M controls independent output rows per program.
reduction:
  - META:
      BLOCK_M: 1
      BLOCK_N: 64
    num_warps: 1
    num_stages: 1
  - META:
      BLOCK_M: 2
      BLOCK_N: 128
    num_warps: 2
    num_stages: 1
  - META:
      BLOCK_M: 4
      BLOCK_N: 256
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 8
      BLOCK_N: 512
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_N: 8
    num_warps: 1
    num_stages: 1
  - META:
      BLOCK_M: 128
      BLOCK_N: 8
    num_warps: 2
    num_stages: 1
  - META:
      BLOCK_M: 256
      BLOCK_N: 8
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 512
      BLOCK_N: 8
    num_warps: 8
    num_stages: 1

# gfx936-safe starting space for the common strided MatMul kernel. It uses
# strict IEEE input precision; no CUDA TF32 policy is inherited.
matmul:
  - META:
      BLOCK_M: 16
      BLOCK_N: 16
      BLOCK_K: 16
      GROUP_M: 4
    num_warps: 2
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_N: 32
      BLOCK_K: 16
      GROUP_M: 4
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_N: 64
      BLOCK_K: 32
      GROUP_M: 4
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_N: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 4
    num_stages: 2

# Conservative common-convolution search space for gfx936.  The planner
# projects each entry onto the META keys consumed by its selected 1D/2D/3D,
# dgrad, or wgrad kernel.
conv2d_spatial:
  - META:
      BLOCK_M: 16
      BLOCK_HW: 16
      BLOCK_OC: 16
      BLOCK_CI: 16
      BLOCK_K: 16
      GROUP_M: 4
    num_warps: 2
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_HW: 32
      BLOCK_OC: 32
      BLOCK_CI: 16
      BLOCK_K: 16
      GROUP_M: 4
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_HW: 32
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_HW: 64
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 8
    num_stages: 2

# Layer/RMS kernels have both a single-block path and a tiled fallback when
# BLOCK_SIZE is smaller than the normalized row. ROWS_PER_PROGRAM provides a
# second wave64-safe search dimension.
layer_norm:
  - META: {BLOCK_SIZE: 256, ROWS_PER_PROGRAM: 1}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 256, ROWS_PER_PROGRAM: 2}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 512, ROWS_PER_PROGRAM: 1}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 512, ROWS_PER_PROGRAM: 2}
    num_warps: 8
    num_stages: 1
  - META: {BLOCK_SIZE: 1024, ROWS_PER_PROGRAM: 1}
    num_warps: 8
    num_stages: 1
  - META: {BLOCK_SIZE: 1024, ROWS_PER_PROGRAM: 2}
    num_warps: 8
    num_stages: 2
  - META: {BLOCK_SIZE: 2048, ROWS_PER_PROGRAM: 1}
    num_warps: 8
    num_stages: 1
  - META: {BLOCK_SIZE: 2048, ROWS_PER_PROGRAM: 2}
    num_warps: 8
    num_stages: 2
  - META: {BLOCK_SIZE: 4096, ROWS_PER_PROGRAM: 1}
    num_warps: 8
    num_stages: 1
  - META: {BLOCK_SIZE: 4096, ROWS_PER_PROGRAM: 2}
    num_warps: 8
    num_stages: 2

rms_norm:
  - META: {BLOCK_SIZE: 256, ROWS_PER_PROGRAM: 1}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 256, ROWS_PER_PROGRAM: 2}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 512, ROWS_PER_PROGRAM: 1}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 512, ROWS_PER_PROGRAM: 2}
    num_warps: 8
    num_stages: 1
  - META: {BLOCK_SIZE: 1024, ROWS_PER_PROGRAM: 1}
    num_warps: 8
    num_stages: 1
  - META: {BLOCK_SIZE: 1024, ROWS_PER_PROGRAM: 2}
    num_warps: 8
    num_stages: 2
  - META: {BLOCK_SIZE: 2048, ROWS_PER_PROGRAM: 1}
    num_warps: 8
    num_stages: 1
  - META: {BLOCK_SIZE: 2048, ROWS_PER_PROGRAM: 2}
    num_warps: 8
    num_stages: 2
  - META: {BLOCK_SIZE: 4096, ROWS_PER_PROGRAM: 1}
    num_warps: 8
    num_stages: 1
  - META: {BLOCK_SIZE: 4096, ROWS_PER_PROGRAM: 2}
    num_warps: 8
    num_stages: 2

batch_norm:
  - META: {BLOCK_SIZE: 128}
    num_warps: 2
    num_stages: 1
  - META: {BLOCK_SIZE: 256}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_SIZE: 512}
    num_warps: 4
    num_stages: 2
  - META: {BLOCK_SIZE: 1024}
    num_warps: 8
    num_stages: 2

sdpa:
  - META: {BLOCK_M: 16, BLOCK_N: 16}
    num_warps: 2
    num_stages: 1
  - META: {BLOCK_M: 32, BLOCK_N: 16}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_M: 32, BLOCK_N: 32}
    num_warps: 4
    num_stages: 2
  - META: {BLOCK_M: 64, BLOCK_N: 32}
    num_warps: 8
    num_stages: 2

sdpa_backward_dq:
  - META:
      BLOCK_M: 16
      BLOCK_N: 16
      BLOCK_D_OUT: 16
      BLOCK_DV_OUT: 16
    num_warps: 2
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_N: 16
      BLOCK_D_OUT: 16
      BLOCK_DV_OUT: 16
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_N: 32
      BLOCK_D_OUT: 32
      BLOCK_DV_OUT: 32
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_N: 32
      BLOCK_D_OUT: 32
      BLOCK_DV_OUT: 32
    num_warps: 8
    num_stages: 2

sdpa_fp8:
  - META: {BLOCK_M: 16, BLOCK_N: 16}
    num_warps: 2
    num_stages: 1
  - META: {BLOCK_M: 32, BLOCK_N: 16}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_M: 32, BLOCK_N: 32}
    num_warps: 4
    num_stages: 2
  - META: {BLOCK_M: 64, BLOCK_N: 32}
    num_warps: 8
    num_stages: 2

sdpa_fp8_backward_dq:
  - META: {BLOCK_M: 16, BLOCK_N: 16}
    num_warps: 2
    num_stages: 1
  - META: {BLOCK_M: 32, BLOCK_N: 16}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_M: 32, BLOCK_N: 32}
    num_warps: 4
    num_stages: 2
  - META: {BLOCK_M: 64, BLOCK_N: 32}
    num_warps: 8
    num_stages: 2
