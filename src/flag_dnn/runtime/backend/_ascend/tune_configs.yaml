# Complex operators use one conservative Ascend configuration per kernel.
# This prevents the Ascend runtime from inheriting NVIDIA's autotune search
# spaces while keeping every NVIDIA configuration and dispatch path untouched.
matmul:
  - META:
      BLOCK_M: 32
      BLOCK_N: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 4
    num_stages: 1
matmul_persistent:
  - META:
      BLOCK_M: 32
      BLOCK_N: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 4
    num_stages: 1
